; Character Highlight - while the highlight key is held, characters are
; tinted by how they stand to you. A LEOPARD fork of BFrizzleFoShizzle's
; KenshiLib example; settings are easier in Mod Config Menu (Options, MCM).

[CharacterHighlight]

; 0 - no tint.
Enabled=1

; The tint shows while this key is held (ALT, CTRL+B, ...). NONE - always on.
HoldKey=ALT

; Tinted characters are visible through walls.
ShowThroughWalls=1

; Characters farther than this from the camera centre, m, are not tinted.
; 0 - no limit.
MaxDistance=0

; Colour strength, 0-100. Lower values preserve clothing and skin textures.
TintIntensity=100

; Hover without the show key. Disabled by default to preserve existing play.
HoverHighlight=0

; Relationship-coloured NPC names, separate from model tint.
NamesEnabled=0
NamesKey=CTRL+N
NameOffsetX=0
NameOffsetY=8

; Colours, #RRGGBB.
SquadColour=#0000FF
EnemyColour=#FF0000
AllyColour=#00FF00

; 1 - neutrals from red through yellow to green by their faction's
; relation to you (as in the original); 0 - NeutralColour.
NeutralByRelation=1
NeutralColour=#FFFF00

; Which kinds are tinted: your squad, enemies, allies, neutrals.
ShowSquad=1
ShowEnemies=1
ShowAllies=1
ShowNeutrals=1

; Faction diplomats (diplomatic status) in their own colour, before any
; other kind.
ShowDiplomats=1
DiplomatColour=#A040FF

; Every 10 seconds in RE_Kenshi_log.txt: characters known, work done.
Debug=0
