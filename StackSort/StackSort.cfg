# StackSort configuration. Place this file next to StackSort.dll.
#
# Lines starting with # are comments, and an inline # comments out the rest
# of the line. Unknown keys, unparsable values and values outside the listed
# range are ignored with a warning in RE_Kenshi_log.txt; the rest of the file
# is still applied.

# 0 = errors only, 1 = normal, 2 = verbose (adds per-job packer lines).
log_level=0                  # range 0..2

# Dimension the sort targets first. H packs to a height, W to a width.
default_dim=H                # H | W | height | width

# Merge stackable items into full stacks before the first sort.
consolidate_stacks=true      # true | false

# Background packing threads.
num_workers=4                # range 1..8

# Quiet period after an inventory change before re-packing it.
mutation_debounce_ms=150     # range 0..5000

# Inventories re-snapshotted per frame after a burst of changes.
resnapshots_per_frame=3      # range 1..16

# Entries in the sort button's click cycle.
top_targets=5                # range 1..10

# Button strip geometry, in pixels. Raise sort_button_width if a translated
# caption is clipped.
arrow_button_width=30        # range 10..200
dim_button_width=40          # range 10..200
sort_button_width=180        # range 40..600
button_gap=2                 # range 0..50
body_x_offset=-35            # range -500..500

# Search budget. Left commented out, the packer's compiled defaults apply --
# those are the settings every published quality measurement used. Uncomment
# only to experiment: larger values cost CPU, smaller ones cost layout quality.
#first_pass_restarts=-1      # range 1..256,       -1 = compiled default
#first_pass_iters=-1         # range 100..1000000, -1 = compiled default
#refine_restarts=-1          # range 1..256,       -1 = compiled default
#refine_iters=-1             # range 100..1000000, -1 = compiled default
#refine_lahc_history=-1      # range 1..100000,    -1 = compiled default
#refine_plateau=-1           # range 1..1000000,   -1 = compiled default
#refine_item_threshold=-1    # range 1..1000,      -1 = compiled default

# Main-thread fallback budget, used only when no precomputed result is ready.
sync_restarts=4              # range 1..8
sync_iters=1000              # range 100..2000
