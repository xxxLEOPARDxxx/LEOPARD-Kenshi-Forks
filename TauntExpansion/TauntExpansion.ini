; Taunt Expansion - MCM fork v1. Original by tata / Tata-Gari.
; Optional MCM applies every setting immediately; no game restart required.
; Current values can also be edited here before starting the game.
[General]
Enabled = true

[Taunt]
; Vanilla Taunt score +2 multiplied by 5 = +10. Range 0..100; 1 = vanilla.
Multiplier = 5.0
; Additional multiplier when an enemy has a valid old target. Range 0..10.
; Default: +2 * 5 * 2 = +20. Does not replace vanilla target-retention rules.
RetargetMultiplier = 2.0

[Logging]
; These options only produce diagnostic output with Debug=true.
LogCandidates = false
LogOnlyWhenTauntPresent = true
LogOnlyChangedSelection = true
MinimumLogIntervalMs = 500
MaximumCandidatesPerEntry = 32
; Master detailed-log switch. Errors are always logged independently.
Debug = false
