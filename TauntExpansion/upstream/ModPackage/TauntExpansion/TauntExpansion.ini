; Taunt Expansion v1.0 RC1
; Expands Kenshi's vanilla Taunt target-score bonus.
;
; Kenshi's confirmed vanilla Taunt bonus is +2.0.
; Changes apply only while the character's Taunt button is enabled.

[General]
Enabled = true

[Taunt]
; Base multiplier for Kenshi's vanilla Taunt bonus.
; Effective bonus = +2.0 x Multiplier
;
; 1.0 = vanilla (+2.0)
; 2.0 = +4.0
; 5.0 = +10.0 (default; strong tank-role setting)
; 10.0 = +20.0 (very strong; not yet balance-tested)
; Allowed range: 0.0 to 100.0
Multiplier = 5.0

; Additional multiplier used when the enemy already has a valid target.
; This does not remove or rewrite Kenshi's target-retention logic.
;
; Effective retarget bonus = +2.0 x Multiplier x RetargetMultiplier
; 1.0 = no additional retarget enhancement
; 1.5 = moderate retarget enhancement
; 2.0 = strong retarget enhancement (default)
; Allowed range: 0.0 to 10.0
RetargetMultiplier = 2.0

[Logging]
; Diagnostic options. Leave false for normal play.
LogCandidates = false
LogOnlyWhenTauntPresent = true
LogOnlyChangedSelection = true
MinimumLogIntervalMs = 500
MaximumCandidatesPerEntry = 32
